<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>村驴菜谱库 🍳</title>
<style>
:root{
  --nav-bg:#2c3e50;
  --body-bg:#fafaf8;
  --card-bg:#ffffff;
  --text:#1a1a1a;
  --text-light:#6b6b6b;
  --border:#e8e6e0;
  --accent:#e67e22;
  --accent2:#e74c3c;
  --green:#27ae60;
  --blue:#2980b9;
  --purple:#8e44ad;
  --teal:#16a085;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--body-bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;line-height:1.6}
/* ===== 顶部导航 ===== */
.top-nav{background:var(--nav-bg);color:#fff;padding:18px 24px}
.top-nav h1{font-size:24px;color:#fff;letter-spacing:1px}
.top-nav h1 span{color:#f39c12}
.top-nav .subtitle{font-size:13px;color:#cfd8dc;margin-top:4px}
/* ===== 统计条 ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1100px;margin:20px auto 0;padding:0 20px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 10px;text-align:center}
.stat-card .num{font-size:26px;font-weight:700}
.stat-card .label{font-size:12px;color:var(--text-light);margin-top:2px}
.stat-card:nth-child(1) .num{color:var(--accent2)}
.stat-card:nth-child(2) .num{color:var(--accent)}
.stat-card:nth-child(3) .num{color:var(--purple)}
/* ===== 工具条 ===== */
.toolbar{max-width:1100px;margin:16px auto 0;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap}
#search{flex:1;min-width:240px;padding:12px 16px;font-size:15px;border:2px solid var(--border);border-radius:10px;background:#fff;color:var(--text);outline:none}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:#999}
#random-btn{padding:12px 20px;font-size:15px;font-weight:700;background:var(--accent2);color:#fff;border:none;border-radius:10px;cursor:pointer;white-space:nowrap}
#random-btn:hover{background:#c0392b}
#fav-btn{padding:12px 20px;font-size:15px;font-weight:700;background:#fff;border:2px solid var(--border);border-radius:10px;cursor:pointer;color:var(--text);white-space:nowrap}
#fav-btn:hover{border-color:var(--accent2)}
#fav-btn.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
#fridge-btn{padding:12px 20px;font-size:15px;font-weight:700;background:#fff;border:2px solid var(--border);border-radius:10px;cursor:pointer;color:var(--text);white-space:nowrap}
#fridge-btn:hover{border-color:var(--green)}
#fridge-btn.active{background:var(--green);border-color:var(--green);color:#fff}
/* 存储降级提示 */
#storage-warn{display:none;max-width:1100px;margin:12px auto 0;padding:10px 16px;font-size:13px;background:#fef9e7;border:1px solid #f3d9a4;border-radius:8px;color:#a8620a}
/* ===== 分类栏（三组） ===== */
.cat-area{max-width:1100px;margin:14px auto 0;padding:0 20px;display:flex;flex-direction:column;gap:8px}
.cat-group{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.cat-label{flex-shrink:0;font-size:12px;font-weight:700;color:#fff;background:var(--nav-bg);border-radius:4px;padding:5px 10px;margin-top:1px;letter-spacing:1px}
.cat-pills{display:flex;flex-wrap:wrap;gap:6px}
.cat-pill{padding:5px 12px;font-size:13px;background:#fff;border:1px solid var(--border);border-radius:20px;cursor:pointer;color:var(--text);user-select:none;transition:all .15s}
.cat-pill:hover{border-color:var(--accent);color:var(--accent)}
.cat-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
/* ===== 结果区 ===== */
#result-info{max-width:1100px;margin:14px auto 0;padding:0 20px;font-size:13px;color:var(--text-light)}
.grid{max-width:1100px;margin:10px auto 40px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:box-shadow .15s,transform .1s;display:flex;flex-direction:column;gap:8px;position:relative}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-2px)}
.card h3{font-size:17px;color:var(--text);padding-right:26px}
.fav-star{position:absolute;top:12px;right:12px;font-size:20px;line-height:1;background:none;border:none;cursor:pointer;color:#cfcfcf;padding:2px;transition:color .15s;z-index:2}
.fav-star:hover{color:#f39c12}
.fav-star.on{color:#f1c40f}
.fav-star.on:hover{color:#f39c12}
.card .desc{font-size:13px;color:var(--text-light);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:var(--text-light);display:flex;gap:12px}
.card .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;color:#fff;background:var(--green)}
.tag.t0{background:var(--accent2)}
.tag.t1{background:var(--accent)}
.tag.t2{background:var(--green)}
.tag.t3{background:var(--blue)}
.tag.t4{background:var(--purple)}
.tag.t5{background:var(--teal)}
#empty{display:none;text-align:center;color:var(--text-light);padding:60px 20px;font-size:15px}
/* ===== 详情弹窗 ===== */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;overflow-y:auto;padding:30px 16px}
#overlay.show{display:block}
#modal{background:#fff;max-width:760px;margin:0 auto;border-radius:12px;padding:26px 30px;position:relative;color:var(--text)}
#modal h2{font-size:22px;color:var(--text);padding-right:40px}
#modal .m-desc{font-size:14px;color:var(--text-light);margin:6px 0 14px}
#modal .m-meta{font-size:12px;color:var(--text-light);margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
#fav-modal-btn{padding:5px 14px;font-size:12px;border:1px solid var(--border);border-radius:16px;background:#fff;color:var(--text);cursor:pointer;font-weight:700}
#fav-modal-btn.on{background:#f1c40f;border-color:#f1c40f;color:#fff}
#close-btn{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.2);color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;line-height:1;z-index:10}
#close-btn:hover{background:rgba(255,255,255,.4)}
.m-section{margin-top:18px}
.m-section h4{font-size:15px;color:var(--nav-bg);border-left:4px solid var(--accent);padding-left:8px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f4f3ef;color:var(--text);font-weight:700}
td:first-child{width:28%}
td:nth-child(2){width:20%}
td .orig{font-size:11px;color:#999;margin-left:4px}
.sub-alt{display:inline-block;margin-top:4px;font-size:12px;background:#eef7ff;border:1px solid #bcd9f2;color:#1a5276;border-radius:4px;padding:3px 8px}
.step-item{display:flex;gap:12px;margin-bottom:12px}
.step-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step-body{font-size:14px}
.step-tip{margin-top:4px;font-size:12px;color:#a8620a;background:#fef9e7;border:1px solid #f3d9a4;border-radius:6px;padding:6px 10px}
.tips-box{background:#fef9e7;border:1px solid #f3d9a4;border-radius:8px;padding:12px 14px;font-size:13px}
.tips-box ul{margin-left:18px}
.video-link{display:inline-block;margin-top:14px;padding:10px 18px;background:var(--blue);color:#fff;text-decoration:none;border-radius:8px;font-size:14px;font-weight:700}
.video-link:hover{background:#1f618d}
/* ===== 详情弹窗增强 ===== */
#modal{max-width:900px;padding:0;overflow:hidden}
.m-header{background:linear-gradient(135deg,#2c3e50 0%,#34495e 100%);color:#fff;padding:24px 28px 18px;position:relative}
.m-header h2{font-size:22px;color:#fff;padding-right:80px;margin-bottom:6px}
.m-header .m-desc{font-size:14px;color:rgba(255,255,255,.8);margin-bottom:12px;line-height:1.5}
.m-header .m-tags{display:flex;flex-wrap:wrap;gap:6px}
.m-header .m-tags .tag{font-size:11px;padding:3px 10px;border-radius:12px;color:#fff;opacity:.9}
.m-header .fav-hdr{position:absolute;top:20px;right:60px;padding:5px 14px;font-size:12px;border:1px solid rgba(255,255,255,.4);border-radius:16px;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-weight:700}
.m-header .fav-hdr.on{background:#f1c40f;border-color:#f1c40f;color:#fff}
.m-header #fav-modal-btn{position:absolute;top:20px;right:60px;padding:5px 14px;font-size:12px;border:1px solid rgba(255,255,255,.4);border-radius:16px;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-weight:700}
.m-header #fav-modal-btn.on{background:#f1c40f;border-color:#f1c40f;color:#fff}
.m-info-bar{display:flex;gap:0;background:#f8f7f4;border-bottom:1px solid var(--border)}
.m-info-item{flex:1;padding:14px 16px;text-align:center;border-right:1px solid var(--border)}
.m-info-item:last-child{border-right:none}
.m-info-item .m-info-icon{font-size:18px;margin-bottom:2px}
.m-info-item .m-info-val{font-size:16px;font-weight:700;color:var(--text)}
.m-info-item .m-info-label{font-size:11px;color:var(--text-light)}
.m-info-item.cal-low .m-info-val{color:#27ae60}
.m-info-item.cal-mid .m-info-val{color:#e67e22}
.m-info-item.cal-high .m-info-val{color:#e74c3c}
.m-body{padding:22px 28px 28px}
.m-two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.m-section{margin-top:0}
.m-section h4{font-size:15px;color:var(--nav-bg);border-left:4px solid var(--accent);padding-left:8px;margin-bottom:10px}
.m-full{grid-column:1/-1;margin-top:20px}
.cal-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}
.cal-badge.low{background:#e8f8f0;color:#27ae60}
.cal-badge.mid{background:#fef5e7;color:#e67e22}
.cal-badge.high{background:#fdedec;color:#e74c3c}
@media(max-width:700px){
  #modal{max-width:100%}
  .m-two-col{grid-template-columns:1fr}
  .m-header{padding:18px 16px 14px}
  .m-body{padding:16px}
  .m-info-item{padding:10px 8px}
  .m-info-item .m-info-val{font-size:14px}
}
/* ===== 份量选择器 ===== */
.portion{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 14px;background:#f4f3ef;border:1px solid var(--border);border-radius:8px}
.portion .p-label{font-size:13px;font-weight:700;color:var(--text)}
.portion .p-hint{font-size:12px;color:var(--text-light)}
.portion .p-btn{padding:5px 14px;font-size:13px;border:1px solid var(--border);border-radius:16px;background:#fff;cursor:pointer;color:var(--text)}
.portion .p-btn.active{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.portion .p-btn:hover{border-color:var(--green)}
/* ===== 冰箱选材面板 ===== */
.fridge-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.fridge-head h3{font-size:18px;color:var(--text)}
.staple-toggle{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none;background:#f4f3ef;border:1px solid var(--border);border-radius:16px;padding:6px 14px;color:var(--text)}
.staple-toggle input{accent-color:var(--green);width:15px;height:15px;cursor:pointer}
.fridge-input-wrap{display:flex;gap:8px;margin-bottom:12px}
#fridge-input{flex:1;padding:10px 14px;font-size:14px;border:2px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none}
#fridge-input:focus{border-color:var(--green)}
#fridge-input::placeholder{color:#999}
.fridge-suggest{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.fridge-suggest .sug{font-size:12px;background:#eef7ff;border:1px solid #bcd9f2;color:#1a5276;border-radius:12px;padding:3px 10px;cursor:pointer}
.fridge-suggest .sug:hover{background:#d9ecfb}
.fridge-picked{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fridge-picked .chip{font-size:13px;background:var(--green);color:#fff;border-radius:14px;padding:4px 12px;cursor:pointer}
.fridge-picked .chip:hover{background:#1e8449}
.fridge-groups{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.fg-title{font-size:13px;font-weight:700;color:var(--nav-bg);margin-bottom:4px}
.fg-btns{display:flex;flex-wrap:wrap;gap:6px}
.ing-chip{font-size:13px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:4px 12px;cursor:pointer;color:var(--text);user-select:none;transition:all .12s}
.ing-chip:hover{border-color:var(--green);color:var(--green)}
.ing-chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
#fridge-go{padding:11px 0;width:100%;font-size:15px;font-weight:700;background:var(--green);color:#fff;border:none;border-radius:8px;cursor:pointer}
#fridge-go:hover{background:#1e8449}
.fridge-results{margin-top:16px}
.fr-group-title{font-size:14px;font-weight:700;margin:12px 0 8px;padding-left:8px;border-left:4px solid var(--accent);color:var(--text)}
.fr-group-title.full{border-color:var(--green)}
.fr-group-title.miss1{border-color:var(--accent)}
.fr-group-title.miss2{border-color:#95a5a6}
.fr-card{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.fr-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.07)}
.fr-card .name{font-size:14px;font-weight:700;color:var(--text)}
.fr-card .miss{font-size:12px;color:var(--text-light)}
.fr-card .miss b{color:#c0392b;font-weight:700}
.fr-card .go{font-size:12px;color:var(--blue)}
#fridge-hint{font-size:12px;color:var(--text-light);margin-top:8px}
footer{max-width:1100px;margin:0 auto 30px;padding:0 20px;font-size:12px;color:var(--text-light);text-align:center}
/* ===== AI搜索 ===== */
#ai-btn{padding:12px 20px;font-size:15px;font-weight:700;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:10px;cursor:pointer;white-space:nowrap}
#ai-btn:hover{opacity:.9;transform:translateY(-1px)}
#ai-btn.active{box-shadow:0 0 0 3px rgba(102,126,234,.3)}
.ai-banner{max-width:1100px;margin:10px auto 0;padding:10px 20px;display:none;align-items:center;gap:10px;flex-wrap:wrap}
.ai-banner.show{display:flex}
.ai-banner .ai-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-radius:20px;font-size:13px;font-weight:700}
.ai-banner .ai-clear{padding:4px 12px;font-size:12px;background:#fff;border:1px solid var(--border);border-radius:14px;cursor:pointer;color:var(--text-light)}
.ai-banner .ai-clear:hover{border-color:var(--accent2);color:var(--accent2)}
.ai-banner .ai-hint{font-size:12px;color:var(--text-light)}
.ai-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ai-modal-head h3{font-size:18px;color:var(--text)}
.ai-search-row{display:flex;gap:8px;margin-bottom:12px}
#ai-query{flex:1;padding:12px 14px;font-size:15px;border:2px solid var(--border);border-radius:10px;background:#fff;color:var(--text);outline:none}
#ai-query:focus{border-color:#667eea}
#ai-query::placeholder{color:#999}
#ai-go{padding:12px 22px;font-size:15px;font-weight:700;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:10px;cursor:pointer;white-space:nowrap}
#ai-go:hover{opacity:.9}
#ai-go:disabled{opacity:.5;cursor:not-allowed}
.ai-examples{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ai-examples .ex{font-size:12px;background:#f0edff;border:1px solid #d5cef8;color:#5b4fa0;border-radius:14px;padding:4px 12px;cursor:pointer;transition:all .15s}
.ai-examples .ex:hover{background:#667eea;color:#fff;border-color:#667eea}
.ai-key-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;padding:10px 14px;background:#f4f3ef;border:1px solid var(--border);border-radius:8px;flex-wrap:wrap}
.ai-key-row label{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap}
#ai-key{flex:1;min-width:180px;padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);outline:none;font-family:monospace}
#ai-key:focus{border-color:#667eea}
.ai-key-hint{font-size:11px;color:var(--text-light);width:100%;margin-top:4px}
.ai-key-hint a{color:var(--blue)}
.ai-loading{text-align:center;padding:30px 20px}
.ai-loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid #e8e6e0;border-top-color:#667eea;border-radius:50%;animation:ai-spin .8s linear infinite}
@keyframes ai-spin{to{transform:rotate(360deg)}}
.ai-loading p{margin-top:12px;font-size:14px;color:var(--text-light)}
.ai-error{padding:14px;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;color:#991b1b;font-size:13px;margin-top:12px}
.ai-result-cards{margin-top:14px}
.ai-result-cards .ai-recipe{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s}
.ai-result-cards .ai-recipe:hover{box-shadow:0 2px 8px rgba(0,0,0,.07)}
.ai-result-cards .ai-recipe .name{font-size:14px;font-weight:700;color:var(--text)}
.ai-result-cards .ai-recipe .tags{font-size:12px;color:var(--text-light)}
.ai-result-cards .ai-recipe .go{font-size:12px;color:var(--blue)}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(3,1fr);gap:8px;padding:0 10px}
  .grid{padding:0 10px;grid-template-columns:1fr}
  .toolbar,.cat-area{padding:0 10px}
  #modal{padding:18px 14px}
  .ai-search-row{flex-direction:column}
}
</style>
</head>
<body>

<div class="top-nav">
  <h1>🍳 村驴菜谱库 <span>·</span> 做饭届博士生导师</h1>
  <div class="subtitle">保姆级美食教程 · 食材精确到克 · 跟着做不翻车</div>
</div>

<div class="stats">
  <div class="stat-card"><div class="num" id="stat-recipes">0</div><div class="label">收录菜谱</div></div>
  <div class="stat-card"><div class="num" id="stat-ing">0</div><div class="label">食材种类</div></div>
  <div class="stat-card"><div class="num" id="stat-tags">0</div><div class="label">风味标签</div></div>
</div>

<div class="toolbar">
  <input type="text" id="search" placeholder="🔍 搜菜名 / 食材 / 标签，比如：鸡胸肉、酸辣、蒸菜、红烧…">
  <button id="random-btn">🎲 今天吃什么</button>
  <button id="fav-btn">❤️ 我的收藏 (0)</button>
  <button id="fridge-btn">🧊 冰箱选材</button>
  <button id="ai-btn">🤖 AI搜索</button>
</div>

<div class="ai-banner" id="ai-banner">
  <span class="ai-tag" id="ai-banner-tag">🤖 AI推荐</span>
  <button class="ai-clear" id="ai-clear">✕ 清除AI搜索</button>
  <span class="ai-hint">AI根据语义智能推荐，结果可能不完全精准</span>
</div>

<div id="storage-warn">⚠️ 当前浏览器禁用了本地存储，收藏只能保留到本次关闭网页前。建议用右下角「导出收藏」保存到文件。</div>

<div class="cat-area">
  <div class="cat-group"><span class="cat-label">荤素</span><div class="cat-pills" id="cats-meat"></div></div>

  // 荤素判定：食材命中肉/蛋类关键词即荤（米面主食、调料类不算）
  function isMeat(r){
    return ingCats(r).some(function(i){return i !== ING_CATS.length-1});
  }
  // 食材组判定（多归属）：返回命中的所有食材类别下标（米面主食除外）
  function ingCats(r){
    var res = [];
    var names = (r.ingredients||[]).map(function(x){return x.name||''});
    for(var i=1;i<ING_CATS.length;i++){
      var hit = names.some(function(n){
        if(isIgnored(n)) return false;
        return ING_CATS[i].kws.some(function(k){return n.indexOf(k)>=0});
      });
      if(hit) res.push(i);
    }
    return res;
  }
  // 做法判定：tags + 菜名
  function methodCat(r){
    var hay = (r.tags||[]).concat([r.dish_name||'']);
    for(var i=1;i<METHOD_CATS.length;i++){
      var hit = hay.some(function(h){return METHOD_CATS[i].kws.some(function(k){return h.indexOf(k)>=0})});
      if(hit) return i;
    }
    return 0;
  }

  function findSub(name){
    for(var i=0;i<SUBS.length;i++){
      if(name.indexOf(SUBS[i].kw)>=0) return SUBS[i].alt;
    }
    return null;
  }

  /* ==================== 用量缩放 ==================== */
  var CN_NUM = {'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'半':0.5};
  function bestFrac(n){
    if(n<0.02) return '0';
    var cands=[[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,6],[5,6],[1,8],[3,8],[5,8],[7,8],[1,10],[3,10],[7,10],[9,10]];
    for(var i=0;i<cands.length;i++){
      if(Math.abs(n-cands[i][0]/cands[i][1])<0.03) return cands[i][0]+'/'+cands[i][1];
    }
    return null;
  }
  function fmtNum(n){
    var r=Math.round(n*100)/100;
    if(Number.isInteger(r)) return String(r);
    var f=bestFrac(r);
    return f?f:String(r);
  }
  function scaleAmount(amount, factor){
    if(!amount) return '';
    if(factor===1) return amount;
    var s=amount.replace(/[零一二三四五六七八九十两半]/g,function(c){return CN_NUM[c]!==undefined?String(CN_NUM[c]):c;});
    s=s.replace(/(\d+)\s*\/\s*(\d+)/g,function(m,a,b){return fmtNum(parseFloat(a)/parseFloat(b)*factor);});
    s=s.replace(/(\d+(?:\.\d+)?)/g,function(m){return fmtNum(parseFloat(m)*factor);});
    return s;
  }

  /* ==================== 收藏 ==================== */
  var FAV_KEY='cunlv_favs_v1';
  var favs=[],favOk=true;
  try{favs=JSON.parse(localStorage.getItem(FAV_KEY)||'[]')||[];}catch(e){favOk=false;}
  if(!Array.isArray(favs)) favs=[];
  function saveFavs(){
    if(!favOk) return;
    try{localStorage.setItem(FAV_KEY,JSON.stringify(favs));}catch(e){favOk=false;showStorageWarn();}
  }
  function showStorageWarn(){document.getElementById('storage-warn').style.display='block';}
  function isFav(name){return favs.indexOf(name)>=0;}
  function toggleFav(name){
    var i=favs.indexOf(name);
    if(i>=0){favs.splice(i,1);}else{favs.unshift(name);}
    saveFavs();updateFavBtn();
  }
  function updateFavBtn(){
    var b=document.getElementById('fav-btn');
    b.textContent='❤️ 我的收藏 ('+favs.length+')';
    b.classList.toggle('active',state.favOnly);
  }
  function exportFavs(){
    var blob=new Blob([JSON.stringify(favs,null,1)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='cunlv_favs_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  }
  function importFavs(file){
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var arr=JSON.parse(reader.result);
        if(!Array.isArray(arr)) throw new Error('格式不对');
        favs=arr.filter(function(n){return typeof n==='string'});
        saveFavs();updateFavBtn();render();
        alert('✅ 已导入 '+favs.length+' 个收藏');
      }catch(e){alert('❌ 导入失败：文件不是有效的收藏 JSON');}
    };
    reader.readAsText(file);
  }
  document.getElementById('fav-btn').addEventListener('click',function(){
    state.favOnly=!state.favOnly;updateFavBtn();render();
  });
  document.getElementById('fav-export').addEventListener('click',function(e){e.preventDefault();exportFavs();});
  document.getElementById('fav-import').addEventListener('click',function(e){e.preventDefault();document.getElementById('fav-file').click();});
  document.getElementById('fav-file').addEventListener('change',function(){
    if(this.files&&this.files[0]) importFavs(this.files[0]);
    this.value='';
  });
  if(!favOk) showStorageWarn();

  /* ==================== 冰箱选材 ==================== */
  // 常备调料（开关开启时视为已有）
  var STAPLE_SET = ['食用油','盐','白糖','冰糖','生抽','老抽','蚝油','味精','鸡精','大蒜','姜','大葱','小葱','洋葱','八角','花椒','花椒粉','香叶','桂皮','白胡椒粉','黑胡椒粉','十三香','五香粉','干辣椒','辣椒面','小米辣','料酒','陈醋','香醋','白醋','淀粉','香油','辣椒油','白芝麻','黄豆酱','郫县豆瓣酱','甜面酱','豆豉','番茄酱','蜂蜜','猪油','高度白酒','孜然','野山椒','泡椒','剁椒','虾皮'];

    {title:'🥬 蔬菜', ings:['土豆','胡萝卜','青椒','茄子','番茄','黄瓜','大白菜','娃娃菜','包菜','菠菜','油菜','生菜','芹菜','韭菜','蒜苔','豆角','西兰花','莲藕','白萝卜','南瓜','冬瓜','玉米','香菇','木耳','金针菇','杏鲍菇','豆芽','香菜','洋葱']},

  function openFridge(){
    var m=document.getElementById('modal');
    var stapleChecked=fridge.staple?'checked':'';
    var pickedHtml=fridge.items.map(function(n){
      return '<span class="chip" data-n="'+esc(n)+'">'+esc(n)+' ✕</span>';
    }).join('');
    var groupsHtml=FRIDGE_GROUPS.map(function(g){
      var btns=g.ings.map(function(n){
        var on=fridge.items.indexOf(n)>=0?' on':'';
        return '<span class="ing-chip'+on+'" data-n="'+esc(n)+'">'+esc(n)+'</span>';
      }).join('');
      return '<div class="fg"><div class="fg-title">'+g.title+'</div><div class="fg-btns">'+btns+'</div></div>';
    }).join('');

      '<button id="close-btn" onclick="document.getElementById(\'overlay\').classList.remove(\'show\')">✕</button>'+

      '<div class="fridge-groups">'+groupsHtml+'</div>'+

      fridge.staple=this.checked;
    });
    document.getElementById('fridge-add').addEventListener('click',addFridgeInput);

      chip.addEventListener('click',function(){
        var n=chip.getAttribute('data-n');
        var i=fridge.items.indexOf(n);
        if(i>=0){fridge.items.splice(i,1);}else{fridge.items.push(n);}
        openFridge();
      });
    });
    m.querySelectorAll('.fridge-picked .chip').forEach(function(chip){
      chip.addEventListener('click',function(){
        var n=chip.getAttribute('data-n');
        var i=fridge.items.indexOf(n);
        if(i>=0)fridge.items.splice(i,1);
        openFridge();
      });
    });
    document.getElementById('fridge-go').addEventListener('click',fridgeSearch);
    document.getElementById('overlay').classList.add('show');
    document.getElementById('overlay').scrollTop=0;
    document.getElementById('fridge-btn').classList.add('active');
  }
  function addFridgeInput(){
    var inp=document.getElementById('fridge-input');
    var v=(inp.value||'').trim();
    if(!v) return;
    if(fridge.items.indexOf(v)<0) fridge.items.push(v);
    inp.value='';
    document.getElementById('fridge-suggest').innerHTML='';
    openFridge();
  }
  function fridgeSuggest(){
    var v=(document.getElementById('fridge-input').value||'').trim();
    var box=document.getElementById('fridge-suggest');
    if(!v){box.innerHTML='';return;}
    var hits=ALL_INGS.filter(function(n){
      return n.indexOf(v)>=0 && fridge.items.indexOf(n)<0;
    }).slice(0,8);
    box.innerHTML=hits.map(function(n){
      return '<span class="sug" data-n="'+esc(n)+'">'+esc(n)+'</span>';
    }).join('');
    box.querySelectorAll('.sug').forEach(function(s){
      s.addEventListener('click',function(){

  // 做法标签热量修正系数
  var CAL_METHOD={
    '蒸':0.85,'煮':0.85,'炖':0.95,'凉拌':0.7,'水煮':0.8,'清蒸':0.8,
    '炒':1.1,'煎':1.15,'烧':1.1,'焖':1.05,'烤':1.05,

  function estimateCal(r){
    // 1. 基于食材估算总热量
    var totalCal=0,matched=0;
    (r.ingredients||[]).forEach(function(x){
      var name=(x.name||'').replace(/[（(].*/,'').replace(/（.*$/,'').trim();
      var amt=x.amount||'';
      // 尝试从amount中提取克数
      var grams=parseGrams(amt);
      if(!grams){grams=defaultGrams(name);}
      // 查找热量
      var cal100=findCal(name);
      if(cal100>0){
        totalCal+=cal100*grams/100;
        matched++;
      }
    });
    // 2. 做法修正
    var methodFactor=1.0;
    (r.tags||[]).forEach(function(t){
      if(CAL_METHOD[t]&&CAL_METHOD[t]>methodFactor) methodFactor=CAL_METHOD[t];
    });
    totalCal*=methodFactor;
    // 3. 如果匹配食材太少，用标签兜底估算
    if(matched<2){
      var tags=(r.tags||[]).join(' ');
      if(/减脂|低卡|清淡|轻食/.test(tags)) totalCal=250*2;
      else if(/炖|煲|汤|粥/.test(tags)) totalCal=200*2;
      else if(/炸|红烧|干锅|酥/.test(tags)) totalCal=600*2;
      else totalCal=400*2;
    }
    // 4. 按人份折算（默认2.5人份）
    var servings=2.5;
    var perPerson=Math.round(totalCal/servings);
    // 5. 合理性上限
    if(perPerson>1200)perPerson=1200;
    // 6. 返回结果
    var level=perPerson<=300?'low':perPerson<=550?'mid':'high';
    var levelText=perPerson<=300?'低卡':perPerson<=550?'中等':'偏高';
    return{total:Math.round(totalCal),per:perPerson,level:level,levelText:levelText,servings:servings};
  }

  function parseGrams(s){
    if(!s)return 0;
    // 匹配数字+克/g
    var m=s.match(/(\d+(?:\.\d+)?)\s*(?:克|g|kg|KG)/);
    if(m){var v=parseFloat(m[1]);return s.match(/kg|KG/)?v*1000:v;}
    // 匹配中文数字+斤/两
    var m2=s.match(/(半|一|二|三|四|五|六|七|八|九|十)\s*(斤|两)/);
    if(m2){var n={'半':0.5,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};return(n[m2[1]]||1)*(m2[2]==='斤'?500:50);}
    // 匹配数字+斤
    var m3=s.match(/(\d+(?:\.\d+)?)\s*斤/);
    if(m3)return parseFloat(m3[1])*500;
    // 匹配数字+两
    var m4=s.match(/(\d+(?:\.\d+)?)\s*两/);
    if(m4)return parseFloat(m4[1])*50;
    // 匹配数字+个/粒/片/根/颗（按食材类型给默认重量）
    var m5=s.match(/(\d+)\s*(?:个|粒|片|根|颗|条|块|只|头|段)/);
    if(m5)return parseInt(m5[1],10)*80; // 默认每个约80g
    // 匹配数字+勺
    var m6=s.match(/(\d+(?:\.\d+)?)\s*(?:勺|汤匙)/);
    if(m6)return parseFloat(m6[1])*15;
    var m7=s.match(/(\d+)\s*茶勺/);
    if(m7)return parseInt(m7[1],10)*5;
    return 0;
  }

  function defaultGrams(name){
    // 没有解析出克数时，按食材类型给默认量
    if(/油|酱|醋|酒|酱油|生抽|老抽|蚝油/.test(name))return 10;
    if(/盐|糖|味精|鸡精|胡椒|花椒|八角|桂皮|香叶|淀粉|粉$/.test(name))return 5;
    if(/姜|蒜|葱|香菜/.test(name))return 10;
    if(/辣椒|椒/.test(name))return 15;
    return 60;
  }

  function findCal(name){
    // 精确匹配
    if(CAL_MAP[name])return CAL_MAP[name];
    // 部分匹配（食材名包含映射key，或映射key包含食材名）
    var best=0;
    for(var k in CAL_MAP){
      if(name.indexOf(k)>=0||k.indexOf(name)>=0){
        if(CAL_MAP[k]>best)best=CAL_MAP[k];
      }
    }
    return best;
  }

    '快手':['快手','10分钟','15分钟','简单','省事','懒人','微波','电饭煲','速成'],
    '夏天':['凉菜','凉拌','冷面','冰','清爽','开胃','酸','绿豆','冷'],
    '冬天':['炖菜','火锅','汤','暖身','羊肉','牛肉','红烧','砂锅'],
    '早餐':['早餐','粥','鸡蛋','牛奶','面包','包子','馒头','豆浆','油条','煎饼'],
    '午餐':['午餐','便当','快手','下饭菜','盖饭'],
    '晚餐':['晚餐','清淡','减脂','少油','轻食','汤'],
    '清淡':['清淡','蒸','水煮','凉拌','少油','低卡','汤','粥'],
    '辣':['辣','麻辣','香辣','微辣','重辣','辣椒','花椒','水煮鱼'],
    '甜':['甜','糖醋','红糖','冰糖','蜂蜜','甜品','蛋糕','布丁'],
    '汤':['汤','炖','煲','砂锅','滋补','养生'],
    '素菜':['素','蔬菜','豆腐','菌菇','青菜','西兰花','土豆','茄子'],
    '肉':['肉','牛肉','猪肉','鸡肉','羊肉','排骨','红烧','炖肉']
  };

  // 精简菜谱数据（给AI的上下文，只保留核心信息减少token）
  function compactRecipes(list){
    return (list||RECIPES).map(function(r){
      var tags=(r.tags||[]).slice(0,8).join(',');
      var ings=(r.ings_norm||[]).slice(0,10).join(',');
      return r.id+'.'+r.dish_name+'|'+tags+'|'+ings;
    }).join('\n');
  }

  // 本地关键词预筛选（语义扩展+关键词匹配，缩小AI候选集）
  function preFilter(query){
    var q=query.toLowerCase();
    // 1. 基础关键词：原词 + 2字滑窗
    var kws=[q];
    for(var i=0;i<q.length-1;i++) kws.push(q.slice(i,i+2));
    // 2. 语义扩展：从映射表查找相关词
    for(var key in SEMANTIC_MAP){
      if(q.indexOf(key)>=0||key.indexOf(q)>=0){
        SEMANTIC_MAP[key].forEach(function(w){if(kws.indexOf(w)<0)kws.push(w);});
      }
    }
    // 去重
    var kwSet={};kws=kws.filter(function(k){if(kwSet[k])return false;kwSet[k]=true;return true;});
    var matched=[];
    RECIPES.forEach(function(r){
      var hay=[r.dish_name,r.description||''].concat(r.tags||[],r.ings_norm||[]).join(' ').toLowerCase();
      for(var i=0;i<kws.length;i++){
        if(hay.indexOf(kws[i])>=0){matched.push(r);return;}
      }
    });
    // 预筛选结果>=1道时用候选集，否则用全量（但上限80道）
    var pool=matched.length>=1?matched:RECIPES;
    // 打乱顺序，取前80道（避免AI看到连续ID）
    if(pool.length>80){
      var shuffled=pool.slice().sort(function(){return Math.random()-0.5;});
      return shuffled.slice(0,80);
    }
    return pool;
  }

  // 打开AI搜索弹窗
  function openAISearch(){
    var m=document.getElementById('modal');
    var keyVal=aiState.key||'';
    var maskedKey=keyVal?keyVal.slice(0,4)+'****'+keyVal.slice(-4):'';
    m.innerHTML=
      '<button id="close-btn" onclick="document.getElementById(\'overlay\').classList.remove(\'show\')">✕</button>'+
      '<div class="ai-modal-head"><h3>🤖 AI智能搜索</h3></div>'+
      '<div class="ai-key-row">'+
        '<label>🔑 智谱API Key：</label>'+
        '<input type="password" id="ai-key" placeholder="'+(keyVal?'已配置 ('+maskedKey+')':'填入你的API Key')+'" >'+
        '<button id="ai-key-save" style="padding:6px 14px;font-size:13px;background:#667eea;color:#fff;border:none;border-radius:6px;cursor:pointer">保存</button>'+
        '<div class="ai-key-hint">使用智谱清言API，<a href="https://open.bigmodel.cn/" target="_blank">去获取Key</a> · Key仅保存在你的浏览器本地，不会上传</div>'+
      '</div>'+
      '<div class="ai-search-row">'+
        '<input type="text" id="ai-query" placeholder="用自然语言描述你想吃什么，比如：减脂餐、适合老人吃的、夏天开胃菜…">'+
        '<button id="ai-go">🔍 搜索</button>'+
      '</div>'+
      '<div class="ai-examples">'+
        '<span class="ex">减脂餐</span>'+
        '<span class="ex">适合老人</span>'+
        '<span class="ex">快手菜10分钟</span>'+
        '<span class="ex">夏天开胃</span>'+
        '<span class="ex">下酒菜</span>'+
        '<span class="ex">孩子爱吃</span>'+
        '<span class="ex">补血补气</span>'+
        '<span class="ex">高蛋白</span>'+
      '</div>'+
      '<div id="ai-status"></div>';
    // 事件绑定
    document.getElementById('ai-key-save').addEventListener('click',function(){
      var k=document.getElementById('ai-key').value.trim();
      if(k){aiState.key=k;try{localStorage.setItem(AI_KEY,k);}catch(e){}alert('✅ API Key已保存');openAISearch();}
    });
    document.getElementById('ai-go').addEventListener('click',doAISearch);
    document.getElementById('ai-query').addEventListener('keydown',function(e){
      if(e.key==='Enter'){e.preventDefault();doAISearch();}
    });
    m.querySelectorAll('.ai-examples .ex').forEach(function(ex){
      ex.addEventListener('click',function(){
        document.getElementById('ai-query').value=ex.textContent;
        doAISearch();
      });
    });
    document.getElementById('overlay').classList.add('show');
    document.getElementById('overlay').scrollTop=0;
    document.getElementById('ai-btn').classList.add('active');
    setTimeout(function(){document.getElementById('ai-query').focus();},100);
  }

  // 执行AI搜索
  function doAISearch(){
    var query=(document.getElementById('ai-query').value||'').trim();
    if(!query){alert('请输入搜索内容');return;}
    if(!aiState.key){alert('请先配置智谱API Key');return;}
    var statusEl=document.getElementById('ai-status');
    var goBtn=document.getElementById('ai-go');
    goBtn.disabled=true;
    // 本地预筛选，缩小候选集（语义扩展+关键词匹配，上限80道）
    var candidates=preFilter(query);
    statusEl.innerHTML='<div class="ai-loading"><div class="spinner"></div><p>AI正在分析'+candidates.length+'道候选菜谱…</p></div>';
    // 构建精简prompt
    var recipeList=compactRecipes(candidates);
    var sysMsg='你是菜谱推荐专家。根据菜谱的标签和食材，语义匹配用户需求。仔细阅读每道菜的标签和食材，选出真正符合需求的菜，不要随意猜测。';
    var userMsg='菜谱列表（每行格式：ID.菜名|标签|食材）：\n'+recipeList+'\n\n用户需求：'+query+'\n请仔细分析每道菜的标签和食材是否与用户需求语义相关，选出匹配的菜谱ID。只输出ID，逗号分隔，最多15个。不要输出其他文字。';
    // 调用智谱API
    fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+aiState.key
      },
      body:JSON.stringify({
        model:'glm-4-flash',
        messages:[
          {role:'system',content:sysMsg},
          {role:'user',content:userMsg}
        ],
        temperature:0.1,
        max_tokens:150
      })
    }).then(function(res){
      if(!res.ok) return res.text().then(function(t){throw new Error('API错误 ('+res.status+'): '+t.slice(0,200));});
      return res.json();
    }).then(function(data){
      var content=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'';
      // 解析ID列表（兼容多种格式：纯数字逗号、带序号、换行等）
      var ids=content.replace(/[^\d,]/g,'').split(',').map(function(s){return parseInt(s,10);}).filter(function(n){return n>0 && n<=RECIPES.length;});
      // 去重
      var seen={};ids=ids.filter(function(n){if(seen[n])return false;seen[n]=true;return true;});
      aiState.active=true;aiState.ids=ids;aiState.query=query;
      // 关闭弹窗，显示结果
      document.getElementById('overlay').classList.remove('show');
      showAIResults();
    }).catch(function(err){
      statusEl.innerHTML='<div class="ai-error">❌ 搜索失败：'+esc(err.message||'未知错误')+'</div>';
    }).finally(function(){
      goBtn.disabled=false;
    });
  }

  // 显示AI搜索结果
  function showAIResults(){
    var banner=document.getElementById('ai-banner');
    var tag=document.getElementById('ai-banner-tag');
    tag.textContent='🤖 AI推荐：'+aiState.query+'（'+aiState.ids.length+'道）';
    banner.classList.add('show');
    document.getElementById('ai-btn').classList.add('active');
    render();
  }

  // 清除AI搜索
  function clearAISearch(){
    aiState.active=false;aiState.ids=[];aiState.query='';
    document.getElementById('ai-banner').classList.remove('show');
    document.getElementById('ai-btn').classList.remove('active');
    render();
  }

  // AI搜索按钮事件
  document.getElementById('ai-btn').addEventListener('click',function(){
    if(aiState.active){clearAISearch();return;}
    openAISearch();
  });
  document.getElementById('ai-clear').addEventListener('click',clearAISearch);

  // 修改matchAll，加入AI搜索过滤
  var origMatchAll=matchAll;
  matchAll=function(r){
    if(aiState.active){
      if(aiState.ids.indexOf(r.id)<0) return false;
    }
    return origMatchAll(r);
  };

  render();
  updateFavBtn();
})();
</script>
